<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.gstatic.com https://*.firebaseapp.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.googleapis.com https://*.firebaseapp.com https://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://apis.google.com https://oauth2.googleapis.com; frame-src https://accounts.google.com https://*.firebaseapp.com https://*.google.com; img-src 'self' data: https:"
    />
    <title>VORCE - Masuk dengan Google</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #16223d;
        --border: #233354;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --primary: #3b82f6;
        --primary-2: #2563eb;
        --danger: #ef4444;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      .container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        gap: 20px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand-logo {
        width: 44px; height: 44px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), #8b5cf6);
        display: grid; place-items: center;
        font-weight: 800; font-size: 22px;
      }
      h1 { font-size: 20px; margin: 0; }
      .muted { color: var(--muted); margin: 4px 0 0; font-size: 13px; }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: 100%;
        max-width: 360px;
      }
      .btn-google {
        appearance: none;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: white;
        color: #1f2937;
        font-size: 14px;
        font-weight: 600;
        padding: 12px 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        justify-content: center;
        transition: background 0.15s ease, box-shadow 0.15s ease;
      }
      .btn-google:hover:not([disabled]) {
        background: #f3f4f6;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      }
      .btn-google[disabled] {
        cursor: not-allowed;
        opacity: 0.6;
      }
      .btn-google svg {
        width: 20px; height: 20px;
        flex-shrink: 0;
      }
      .error {
        color: var(--danger);
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        padding: 9px 11px;
        border-radius: 10px;
        margin: 0;
        font-size: 13px;
        text-align: center;
        width: 100%;
      }
      .spinner {
        display: none;
        width: 24px; height: 24px;
        border: 3px solid var(--border);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      .spinner.active { display: block; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="brand">
        <div class="brand-logo">V</div>
        <div>
          <h1>VORCE Agent</h1>
          <p class="muted">Masuk dengan akun Google Anda</p>
        </div>
      </header>

      <div class="card">
        <button id="btn-google" class="btn-google">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Masuk dengan Google
        </button>
        <div id="spinner" class="spinner"></div>
        <p id="error" class="error" style="display:none"></p>
        <p class="muted" style="text-align:center">
          Otentikasi diteruskan ke API VORCE melalui Firebase.
        </p>
      </div>
    </div>

    <script type="module" src="google-auth.js"></script>
  </body>
</html>
