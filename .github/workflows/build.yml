name: Build Vlinked

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python (macOS native build dependency)
        if: matrix.platform == 'mac'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: electron-agent
        run: npm install

      # ═══════════════════════════════════════════════
      # CRITICAL FIX 1: Rebuild native addon against Electron ABI
      # node-gyp alone compiles against Node.js headers.
      # electron-rebuild recompiles against the exact Electron runtime.
      # ═══════════════════════════════════════════════
      - name: Rebuild native modules for Electron (macOS)
        if: matrix.platform == 'mac'
        working-directory: electron-agent
        run: npx electron-rebuild -f -w wifi-native

      # ═══════════════════════════════════════════════
      # CRITICAL FIX 2: Verify native binary exists after rebuild
      # Build MUST fail if wifi_native.node is missing.
      # ═══════════════════════════════════════════════
      - name: Verify native binary exists
        if: matrix.platform == 'mac'
        working-directory: electron-agent
        run: |
          echo "=== Searching for wifi_native.node ==="
          FOUND=$(find . -name "wifi_native.node" -type f 2>/dev/null)
          if [ -z "$FOUND" ]; then
            echo "::error::CRITICAL: wifi_native.node not found after electron-rebuild. Native addon compilation failed."
            exit 1
          fi
          echo "✅ Found native binary:"
          echo "$FOUND"
          for f in $FOUND; do
            echo "--- file info: $f ---"
            file "$f"
          done

      - name: Decode certificate (macOS only)
        if: matrix.platform == 'mac' && env.APPLE_CERTIFICATE_BASE64 != ''
        working-directory: electron-agent
        run: |
          echo "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" | base64 --decode > certificate.p12

      - name: Build Electron app (macOS)
        if: matrix.platform == 'mac'
        working-directory: electron-agent
        run: |
          if [ -s certificate.p12 ]; then
            CSC_LINK="certificate.p12" CSC_KEY_PASSWORD="${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" APPLE_ID="${{ secrets.APPLE_ID }}" APPLE_APP_SPECIFIC_PASSWORD="${{ secrets.APPLE_ID_PASSWORD }}" APPLE_TEAM_ID="TK5W5C4S89" npm run build:mac
          else
            echo "::warning::No valid certificate.p12 found - building unsigned macOS app"
            CSC_IDENTITY_AUTO_DISCOVERY=false npm run build:mac
          fi

      - name: Build Electron app (Windows/Linux)
        if: matrix.platform != 'mac'
        working-directory: electron-agent
        run: npm run build:${{ matrix.platform }}

      # ═══════════════════════════════════════════════
      # CRITICAL FIX 3: Verify binary is packaged in app.asar.unpacked
      # After electron-builder, the .node MUST be outside the ASAR archive.
      # ═══════════════════════════════════════════════
      - name: Verify native binary in app.asar.unpacked
        if: matrix.platform == 'mac'
        working-directory: electron-agent
        run: |
          echo "=== Searching for .node files in dist ==="
          ALL_NODES=$(find dist -name "*.node" -type f 2>/dev/null)
          echo "All .node files found:"
          echo "$ALL_NODES"
          echo ""

          echo "=== Verifying app.asar.unpacked location ==="
          UNPACKED=$(find dist -path "*app.asar.unpacked*" -name "wifi_native.node" -type f 2>/dev/null)
          if [ -z "$UNPACKED" ]; then
            echo "::warning::wifi_native.node NOT found in app.asar.unpacked."
          else
            echo "✅ Native binary correctly unpacked: $UNPACKED"
          fi

      # ═══════════════════════════════════════════════
      # CRITICAL FIX 7: Verify entitlements after codesign
      # Location entitlement MUST be present for CoreWLAN SSID access.
      # ═══════════════════════════════════════════════
      - name: Verify entitlements
        if: matrix.platform == 'mac'
        working-directory: electron-agent
        continue-on-error: true
        run: |
          echo "=== Locating .app bundle ==="
          APP_PATH=$(find dist -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::warning::No .app bundle found in dist. Skipping entitlements check."
            exit 0
          fi
          echo "Found: $APP_PATH"
          echo ""

          echo "=== Extracting entitlements ==="
          ENTITLEMENTS=$(codesign -d --entitlements :- "$APP_PATH" 2>&1) || true
          echo "$ENTITLEMENTS"

      # ═══════════════════════════════════════════════
      # CRITICAL FIX 8: Verify binary architecture
      # Must support the target architecture (arm64 for Apple Silicon).
      # ═══════════════════════════════════════════════
      - name: Verify binary architecture
        if: matrix.platform == 'mac'
        working-directory: electron-agent
        continue-on-error: true
        run: |
          NODE_FILE=$(find dist -path "*app.asar.unpacked*" -name "wifi_native.node" -type f | head -1)
          if [ -n "$NODE_FILE" ]; then
            echo "=== Architecture info ==="
            lipo -info "$NODE_FILE" || file "$NODE_FILE"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vlinked-${{ matrix.platform }}
          path: |
            electron-agent/dist/*.exe
            electron-agent/dist/*.dmg
            electron-agent/dist/*.zip
            electron-agent/dist/*.AppImage
            electron-agent/dist/*.deb
            electron-agent/dist/latest.yml
            electron-agent/dist/latest-mac.yml
            electron-agent/dist/latest-linux.yml
          if-no-files-found: ignore


      - name: Upload macOS DMG to Cloudflare R2
        if: matrix.platform == 'mac' && env.R2_SECRET_ACCESS_KEY != ''
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 rm s3://vorce/Vlinked_Mac/ --recursive --endpoint-url https://609723b5d7cc16b02d6454eebea06c5a.r2.cloudflarestorage.com || true
          aws s3 cp electron-agent/dist/ s3://vorce/Vlinked_Mac/ --recursive --exclude "*" --include "*.dmg" --endpoint-url https://609723b5d7cc16b02d6454eebea06c5a.r2.cloudflarestorage.com

      - name: Upload Windows EXE to Cloudflare R2
        if: matrix.platform == 'win' && env.R2_SECRET_ACCESS_KEY != ''
        continue-on-error: true
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 rm s3://vorce/Vlinked_Windows/ --recursive --endpoint-url https://609723b5d7cc16b02d6454eebea06c5a.r2.cloudflarestorage.com || true
          aws s3 cp electron-agent/dist/ s3://vorce/Vlinked_Windows/ --recursive --exclude "*" --include "*.exe" --endpoint-url https://609723b5d7cc16b02d6454eebea06c5a.r2.cloudflarestorage.com

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/latest.yml
            artifacts/**/latest-mac.yml
            artifacts/**/latest-linux.yml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
