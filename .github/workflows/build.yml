name: Build Vlinked

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: electron-agent
        run: npm install

      - name: Decode certificate (macOS only)
        if: matrix.platform == 'mac'
        working-directory: electron-agent
        run: |
          echo "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" | base64 --decode > certificate.p12

      - name: Build Electron app (macOS)
        if: matrix.platform == 'mac'
        working-directory: electron-agent
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: certificate.p12
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: TK5W5C4S89

      - name: Build Electron app (Windows/Linux)
        if: matrix.platform != 'mac'
        working-directory: electron-agent
        run: npm run build:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vlinked-${{ matrix.platform }}
          path: |
            electron-agent/dist/*.exe
            electron-agent/dist/*.dmg
            electron-agent/dist/*.zip
            electron-agent/dist/*.AppImage
            electron-agent/dist/*.deb
          if-no-files-found: ignore

      - name: Authenticate to Google Cloud
        if: matrix.platform == 'mac' || matrix.platform == 'win'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: matrix.platform == 'mac' || matrix.platform == 'win'
        uses: google-github-actions/setup-gcloud@v2

      - name: Delete old macOS DMG in Firebase Storage
        if: matrix.platform == 'mac'
        run: |
          gcloud storage rm 'gs://hora-7394b.firebasestorage.app/Vlinked_Mac/**' || true

      - name: Delete old Windows EXE in Firebase Storage
        if: matrix.platform == 'win'
        run: |
          gcloud storage rm 'gs://hora-7394b.firebasestorage.app/Vlinked_Windows/**' || true

      - name: Upload macOS DMG to Firebase Storage
        if: matrix.platform == 'mac'
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: 'electron-agent/dist'
          glob: '*.dmg'
          destination: 'hora-7394b.firebasestorage.app/Vlinked_Mac'
          parent: false

      - name: Set Firebase Storage Token for macOS DMG
        if: matrix.platform == 'mac'
        run: |
          gsutil setmeta -h "x-goog-meta-firebaseStorageDownloadTokens:d5dfca38-6797-4c94-8a15-e506a70ef363" "gs://hora-7394b.firebasestorage.app/Vlinked_Mac/*.dmg"

      - name: Upload Windows EXE to Firebase Storage
        if: matrix.platform == 'win'
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: 'electron-agent/dist'
          glob: '*.exe'
          destination: 'hora-7394b.firebasestorage.app/Vlinked_Windows'
          parent: false

      - name: Set Firebase Storage Token for Windows EXE
        if: matrix.platform == 'win'
        run: |
          gsutil setmeta -h "x-goog-meta-firebaseStorageDownloadTokens:1a0689a8-0f9a-46ac-b842-522167326ad0" "gs://hora-7394b.firebasestorage.app/Vlinked_Windows/*.exe"

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
